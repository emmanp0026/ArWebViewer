<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View in AR</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #f5efe6; }
    model-viewer { width: 100%; height: 100%; }
    #ar-button {
      position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
      padding: 14px 28px; font-size: 18px; border: 0; border-radius: 28px;
      background: #3e2723; color: #fff;
    }
  </style>
</head>
<body>
  <model-viewer id="viewer"
                alt="3D model"
                ar
                ar-modes="webxr"
                camera-controls
                touch-action="pan-y"
                shadow-intensity="1"
                environment-image="neutral">
    <button slot="ar-button" id="ar-button">View in AR</button>
  </model-viewer>

  <script>
    // The app passes the model address like: ar.html?src=https://.../dish.glb
    const src = new URLSearchParams(location.search).get("src");
    if (src && src.startsWith("https://")) {
      document.getElementById("viewer").setAttribute("src", src);
    }
  </script>
</body>
</html>
